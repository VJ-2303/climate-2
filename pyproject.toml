[project]
name = "climate-2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lohith889", email = "lohith.24ad@kct.ac.in" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100.0",
    "geopandas>=0.14.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "pyproj>=3.5.0",
    "rasterio>=1.3.0",
    "scipy>=1.10.0",
    "shapely>=2.0.0",
    "torch>=2.0.0",
    "torch-geometric>=2.4.0",
    "uvicorn>=0.22.0",
    "xgboost>=2.0.0",
    "twilio>=9.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
climate-2 = "climate_2:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
